name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flake8>=6.0,<8.0" "pytest>=7.0,<9.0"
          python -m pip install -e ".[all]"

      - name: Lint with flake8
        run: |
          # Stop the build on Python syntax errors or undefined names.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Report style issues without failing this bounded hardening gate.
          flake8 . --count --max-line-length=120 --statistics --exit-zero

      - name: Run full pytest suite
        run: python -m pytest -q
